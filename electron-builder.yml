# electron-builder.yml
# Configuración de empaquetado para generar el instalador .exe (NSIS) y portable.

appId: com.fotografia.gestion
productName: Gestión Fotográfica
copyright: Copyright © 2026

directories:
  output: dist-app
  buildResources: build

# asar: false es OBLIGATORIO para que Prisma pueda cargar su query-engine
# nativo (.node) directamente desde el sistema de archivos. Con asar, los
# binarios .node no se pueden cargar.
asar: false

files:
  - package.json
  - dist/**
  - node_modules/**/*
  - node_modules/.prisma/**/*
  - '!**/*.map'
  - '!src/**'
  - '!tests/**'
  - '!shots/**'
  - '!e2e/**'
  - '!playwright.config.*'
  - '!playwright.electron.config.*'
  - '!generate-icon.js'

win:
  target:
    - nsis
    - portable
  icon: build/icon.png
  # Establece la versión exacta de Electron a usar (coincide con la instalada).
  executableName: GestionFotografica
  # Desactiva edición de recursos y firma del .exe. Esto evita que
  # electron-builder descargue/descomprima `winCodeSign`, que falla en sistemas
  # sin Modo desarrollador (no puede crear symlinks: libcrypto.dylib/libssl.dylib).
  # Coste: el exe conserva el icono/nombre genérico de Electron en sus metadatos,
  # aunque el instalador y la app funcionan correctamente.
  signAndEditExecutable: false

# Visualización y artefactos del instalador
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Gestión Fotográfica
  uninstallDisplayName: Gestión Fotográfica
  deleteAppDataOnUninstall: false

electronDownload:
  cache: null

# No reconstruir paquetes nativos; los binarios ya presentes (Prisma .node)
# se incluyen tal cual. Evita pasos extra al empaquetar.
npmRebuild: false

# Cliente Prisma generado (node_modules/.prisma/client) + query-engine nativo.
# IMPORTANTE: se copia a `app/node_modules/.prisma/client` y NO a resources/prisma
# porque `@prisma/client/default.js` del paquete hace `require('.prisma/client/default')`,
# que Node resuelve relativo a `resources/app/node_modules`. Si se colocara fuera del
# node_modules de la app, el require fallaría con "Cannot find module '.prisma/client/default'".
# (electron-builder NO incluye carpetas ocultas como `.prisma` vía el glob de `files`,
# por eso se hace explícito aquí con extraResources → app/...)
extraResources:
  - from: node_modules/.prisma/client
    to: app/node_modules/.prisma/client
  # Schema y migraciones de Prisma para aplicar `migrate deploy` al arrancar en
  # producción (FASE 2). Se colocan en resources/prisma/ para acompañar al esquema.
  - from: prisma/schema.prisma
    to: prisma/schema.prisma
  - from: prisma/migrations
    to: prisma/migrations

# Empaquetar solo la plataforma actual (Windows x64).
# Para producción multiplataforma habría que ajustar aquí.
